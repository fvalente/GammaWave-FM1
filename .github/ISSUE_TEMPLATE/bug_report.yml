name: Bug report
description: Something in Pocket GammaWave doesn't work as it should (one bug per issue)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        One bug per issue. Ideas are welcome too: open a blank issue with "idea" in the title. This is Pocket GammaWave (GW-1, based on Felucca and JIANT): report here, not to Felucca or JIANT.
  - type: input
    id: version
    attributes:
      label: Pocket GammaWave version
      description: MENU > ABOUT on the FM-1 (or the Web Studio / emulator page)
      placeholder: "v1.1.1-GW"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Computer, OS and browser (if the editor, installer or USB is involved)
      placeholder: "macOS 15.6, Chrome 140"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: A photo or short video helps.
    validations:
      required: true
